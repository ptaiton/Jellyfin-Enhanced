name: MediaForge builds
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [jf10, jf12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Jellyfin.Plugin.JellyfinEnhanced -c Release -p:JellyfinTarget=${{ matrix.target }} -o artifacts/${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Jellyfin-Enhanced-MediaForge-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/Jellyfin.Plugin.JellyfinEnhanced.dll
